listening-port=3478
tls-listening-port=5349

# Realm should match your TURN DNS name.
realm=turn.example.com
server-name=turn.example.com
fingerprint

# Time-limited credential auth.
use-auth-secret
static-auth-secret=replace-with-long-random-secret
credential-lifetime=86400

# Hard limits.
max-bps=512000
user-quota=10
total-quota=100

# Optional hardening.
stale-nonce=600
no-multicast-peers
no-loopback-peers
no-cli

# Relay UDP range (must be opened in firewall/security groups).
min-port=49152
max-port=65535

# TLS for turns:
# cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem
